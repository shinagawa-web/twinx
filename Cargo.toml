[package]
name = "twinx"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
flate2 = "1.1.11"
libc = "0.2"
pkcs8 = { version = "0.11.0", features = ["encryption", "pem", "std"] }
md-5 = "0.10"
ring = "0.17.14"
regex = { version = "1.13.2", default-features = false, features = ["perf", "std", "unicode-case", "unicode-gencat", "unicode-perl"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "zlib"] }
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = { version = "0.18.1", features = ["verify"] }

[profile.release]
# One unit: the functions a request goes through are inlined across modules.
codegen-units = 1
lto = "fat"
