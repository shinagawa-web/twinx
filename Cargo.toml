[package]
name = "twinx"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
flate2 = "1.1.11"
libc = "0.2"
pkcs8 = { version = "0.11.0", features = ["encryption", "pem", "std"] }
regex = { version = "1.13.2", default-features = false, features = ["std", "unicode-case", "unicode-gencat", "unicode-perl"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
socket2 = "0.6"
x509-parser = { version = "0.18.1", features = ["verify"] }
