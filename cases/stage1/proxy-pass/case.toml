description = "Forward requests to an upstream with proxy_pass, with and without a URI part"
config = """
server {
    listen {{port}};
    location /api/ {
        proxy_pass http://{{backend}};
    }
    location /v2/ {
        proxy_pass http://{{backend}}/internal/;
    }
}
"""

[[requests]]
raw = "GET /api/users?id=1 HTTP/1.1\r\nHost: example.test\r\nUser-Agent: twinx-harness\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "POST /v2/items HTTP/1.1\r\nHost: example.test\r\nContent-Type: application/json\r\nContent-Length: 13\r\nConnection: close\r\n\r\n{\"name\":\"a\"}\n"
