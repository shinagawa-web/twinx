description = "Location precedence: exact match, ^~ prefix, regular expressions in order, then the longest prefix"
covers = ["location.exact", "location.no-regex-prefix", "location.regex-order", "location.prefix-longest", "return.text"]
config = """
server {
    listen {{port}};
    location / {
        return 200 "prefix /\\n";
    }
    location = / {
        return 200 "exact /\\n";
    }
    location /images/ {
        return 200 "prefix /images/\\n";
    }
    location ^~ /static/ {
        return 200 "noregex /static/\\n";
    }
    location ~* \\.(gif|jpg|png)$ {
        return 200 "regex image\\n";
    }
    location ~ ^/images/.*\\.png$ {
        return 200 "regex png\\n";
    }
}
"""

[[requests]]
raw = "GET / HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /index.html HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

