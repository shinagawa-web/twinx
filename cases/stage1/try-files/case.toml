description = "try_files falls back to an application shell for paths that do not exist, and to a status code at the end"
config = """
server {
    listen {{port}};
    root {{root}};
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }
    location /strict/ {
        try_files $uri =404;
    }
}
"""

[[requests]]
raw = "GET /app/real.txt HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /app/some/client/route HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /strict/nothing HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"
