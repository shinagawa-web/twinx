description = "Byte ranges on a static file: a start and end, a suffix, an open end, and a range past the end of the file"
covers = ["static.range"]
config = """
server {
    listen {{port}};
    root {{root}};
}
"""

[[requests]]
raw = "GET /data.txt HTTP/1.1\r\nHost: localhost\r\nRange: bytes=0-4\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /data.txt HTTP/1.1\r\nHost: localhost\r\nRange: bytes=-5\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /data.txt HTTP/1.1\r\nHost: localhost\r\nRange: bytes=10-\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /data.txt HTTP/1.1\r\nHost: localhost\r\nRange: bytes=100-200\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /data.txt HTTP/1.1\r\nHost: localhost\r\nRange: bytes=5-1000\r\nConnection: close\r\n\r\n"
