description = "Conditional GET on a static file: If-Modified-Since and If-None-Match that match, and ones that do not"
covers = ["static.conditional-get", "root.server"]
config = """
server {
    listen {{port}};
    root {{root}};
}
"""

[[requests]]
raw = "GET /page.html HTTP/1.1\r\nHost: localhost\r\nIf-Modified-Since: Thu, 01 Jan 2026 00:00:00 GMT\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /page.html HTTP/1.1\r\nHost: localhost\r\nIf-None-Match: \"6955b900-c\"\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /page.html HTTP/1.1\r\nHost: localhost\r\nIf-None-Match: \"other\"\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /page.html HTTP/1.1\r\nHost: localhost\r\nIf-Modified-Since: Wed, 31 Dec 2025 00:00:00 GMT\r\nConnection: close\r\n\r\n"
