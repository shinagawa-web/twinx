description = "try_files serves existing files and hands everything else to a named location that proxies to the application"
covers = ["try-files.file", "try-files.named", "location.named"]
config = """
server {
    listen {{port}};
    root {{root}};
    location / {
        try_files $uri $uri/index.html @app;
    }
    location @app {
        proxy_pass http://{{backend}};
        proxy_set_header X-Fallback yes;
    }
}
"""

[[requests]]
raw = "GET /about.txt HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

