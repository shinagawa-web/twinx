description = "Locations nested in a prefix location: the longest nested prefix wins, nested regular expressions are tried before the outer ones, and the outer location's return does not apply when a nested location is chosen"
covers = ["location.nested", "location.prefix-longest", "location.regex-order"]
config = """
server {
    listen {{port}};
    location /api/ {
        location /api/v1/ {
            return 200 "nested prefix v1\\n";
        }
        location ~ \\.json$ {
            return 200 "nested regex json\\n";
        }
        return 200 "outer api\\n";
    }
    location ~ \\.json$ {
        return 200 "top regex json\\n";
    }
    location / {
        return 200 "root\\n";
    }
}
"""

[[requests]]
raw = "GET /api/users HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /api/v1/users HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /api/data.json HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /api/v1/data.json HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /other/data.json HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"
