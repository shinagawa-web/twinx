description = "proxy_set_header overrides the Host sent upstream, and an empty value (written or from an empty $host) removes the header"
covers = ["proxy-set-header.host", "proxy-set-header.empty-removes"]
config = """
server {
    listen {{port}};
    location /keep-host/ {
        proxy_pass http://{{backend}};
        proxy_set_header Host $host;
    }
    location /fixed-host/ {
        proxy_pass http://{{backend}};
        proxy_set_header Host internal.example;
        proxy_set_header Accept-Encoding "";
        proxy_set_header User-Agent "";
    }
}
"""

[[requests]]
raw = "GET /keep-host/a HTTP/1.1\r\nHost: public.example\r\nUser-Agent: test-agent\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /fixed-host/b?q=1 HTTP/1.1\r\nHost: public.example\r\nUser-Agent: test-agent\r\nAccept-Encoding: gzip\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /keep-host/c HTTP/1.0\r\nConnection: close\r\n\r\n"
