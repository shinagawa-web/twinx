description = "rewrite ... redirect answers 302 and rewrite ... permanent answers 301, keeping the original query string unless the replacement ends in ?"
covers = ["rewrite.redirect", "rewrite.permanent", "rewrite.query-string", "rewrite.captures"]
config = """
server {
    listen {{port}};
    location /temp/ {
        rewrite ^/temp/(.*)$ /moved/$1 redirect;
    }
    location /perm/ {
        rewrite ^/perm/(.*)$ /moved/$1 permanent;
    }
    location /clean/ {
        rewrite ^/clean/(.*)$ /moved/$1? permanent;
    }
    location /args/ {
        rewrite ^/args/(.*)$ /moved/?item=$1 redirect;
    }
}
"""

[[requests]]
raw = "GET /temp/a/b HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /perm/page?x=1&y=2 HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /clean/page?x=1 HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /args/thing?x=1 HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"
