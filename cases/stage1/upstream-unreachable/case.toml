description = "proxy_pass to an upstream that refuses connections answers 502, and add_header always still applies"
covers = ["upstream.unreachable", "add-header.always", "add-header.errors"]
config = """
server {
    listen {{port}};
    location / {
        proxy_pass http://127.0.0.1:1;
        add_header X-Always yes always;
        add_header X-Success yes;
    }
}
"""

[[requests]]
raw = "GET /anything?x=1 HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "POST /form HTTP/1.1\r\nHost: localhost\r\nContent-Length: 3\r\nConnection: close\r\n\r\na=1"
