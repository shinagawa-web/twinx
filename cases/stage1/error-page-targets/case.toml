description = "error_page sends an error to a URI, to a named location, with a changed code, or to an external URL as a redirect"
covers = ["error-page.uri", "error-page.named", "error-page.change-code", "error-page.external"]
config = """
server {
    listen {{port}};
    root {{root}};
    location /custom/ {
        error_page 404 /errors/404.html;
    }
    location /named/ {
        error_page 404 @fallback;
    }
    location /soft/ {
        error_page 404 =200 /errors/404.html;
    }
    location /away/ {
        error_page 404 http://example.test/notfound;
    }
    location /closed/ {
        error_page 403 =404 /errors/404.html;
        return 403;
    }
    location @fallback {
        return 410 "gone from named location\\n";
    }
}
"""

[[requests]]
raw = "GET /custom/nothing HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /named/nothing HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /soft/nothing HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /away/nothing HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /closed/thing HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"
