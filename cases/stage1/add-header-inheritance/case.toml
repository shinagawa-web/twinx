description = "add_header is inherited from the server level only by locations that declare no add_header of their own, and is not added to errors without always"
covers = ["add-header.inheritance", "add-header.errors", "return.text", "return.code"]
config = """
server {
    listen {{port}};
    add_header X-Server-Level s;
    location /inherit {
        return 200 "inherit\\n";
    }
    location /own {
        add_header X-Location-Level l;
        return 200 "own\\n";
    }
    location /error {
        return 404;
    }
}
"""

[[requests]]
raw = "GET /inherit HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /own HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /error HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"
