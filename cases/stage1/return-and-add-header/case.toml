description = "return with a status and a URL, and add_header on success and error responses"
covers = ["return.redirect", "return.code", "return.text", "add-header.always", "add-header.errors"]
config = """
server {
    listen {{port}};
    location = /old {
        return 301 /new;
    }
    location = /gone {
        return 410;
    }
    location = /health {
        add_header X-Check ok;
        add_header X-Always yes always;
        return 200 "up\\n";
    }
    location = /teapot {
        add_header X-Check ok;
        add_header X-Always yes always;
        return 418;
    }
}
"""

[[requests]]
raw = "GET /old HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /gone HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /teapot HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"
