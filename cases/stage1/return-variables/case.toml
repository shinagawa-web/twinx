description = "return with variables: an HTTPS redirect built from $host and $request_uri, a body built from request variables, and a relative redirect"
covers = ["return.variables", "return.redirect", "server-name.exact"]
config = """
server {
    listen {{port}};
    server_name example.test;
    location /secure/ {
        return 301 https://$host$request_uri;
    }
    location = /echo {
        return 200 "$request_method $uri args=$args name=$arg_name\\n";
    }
    location = /moved {
        return 307 /target?from=moved;
    }
}
"""

[[requests]]
raw = "GET /secure/account?tab=1 HTTP/1.1\r\nHost: example.test\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /echo?name=alice&x=2 HTTP/1.1\r\nHost: example.test\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /echo HTTP/1.1\r\nHost: example.test\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "POST /moved HTTP/1.1\r\nHost: example.test\r\nContent-Length: 3\r\nConnection: close\r\n\r\na=1"
