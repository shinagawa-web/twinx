description = "Choose the server by Host: exact name, leading wildcard, then the default_server for unknown hosts"
config = """
server {
    listen {{port}};
    server_name www.example.test;
    return 200 "first\\n";
}
server {
    listen {{port}} default_server;
    server_name _;
    return 200 "default\\n";
}
server {
    listen {{port}};
    server_name example.test *.example.test;
    return 200 "wildcard\\n";
}
"""

[[requests]]
raw = "GET / HTTP/1.1\r\nHost: www.example.test\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET / HTTP/1.1\r\nHost: api.example.test\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET / HTTP/1.1\r\nHost: EXAMPLE.test:18080\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET / HTTP/1.1\r\nHost: unknown.test\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET / HTTP/1.0\r\nConnection: close\r\n\r\n"
