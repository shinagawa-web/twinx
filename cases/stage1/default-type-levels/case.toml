description = "default_type gives the Content-Type of files whose extension has no MIME type (or no extension at all); a location's default_type overrides the server's, and a known extension still wins"
covers = ["default-type.unknown-extension", "default-type.levels", "root.server"]
config = """
server {
    listen {{port}};
    root {{root}};
    default_type text/plain;
    location /raw/ {
        default_type application/x-raw-data;
    }
}
"""

[[requests]]
raw = "GET /notes.xyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /README HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /raw/data.xyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"

[[requests]]
raw = "GET /raw/page.html HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"
