# The nginx-tests files each stage is judged by. Files of earlier stages keep
# running in later stages.
#
# Only subtests that pass on nginx 1.30.6 count: a file or subtest nginx skips
# here (it needs root, another OS, or a tool the image lacks) is not expected.
#
# twinx names itself twinx, not nginx. server_tokens.t checks the name in the
# Server header and error pages, so for twinx it is run expecting "twinx" there,
# and Test::Nginx's version checks (has_version) answer for twinx as for nginx
# 1.30.6 (harness/nginx-tests/rename.pl); nginx runs them as they are.

# Stage 1, static files and reverse proxying over HTTP/1.1, was cut at v0.1.0
# (2026-11-20): these are the files that passed then, and those nginx passes no
# subtest of here. The files of its scope that did not pass yet moved to stage 2.
[stage1]
files = [
  "access_log_variables.t", "body.t", "body_chunked.t", "headers.t",
  "http_absolute_redirect.t", "http_error_page.t", "http_expect_100_continue.t",
  "http_header_buffers.t", "http_host.t", "http_location.t", "http_method.t",
  "upstream.t", "binary_upgrade.t", "client_body_early_read.t",
  "http_listen_wildcard.t", "http_location_predicate.t", "http_location_win32.t",
  "proxy_bind_transparent.t", "proxy_bind_transparent_capability.t",
  "proxy_websocket.t",
]

# Stage 2, done at v0.2.0 (2026-11-22): what stage 1 left (files that need only the http, rewrite and proxy
# modules), and gzip: files that need only those and the gzip, gunzip or
# gzip_static modules. The twinx_*.t files are twinx's own tests
# (harness/nginx-tests/extra): behaviour of those files that nginx-tests does not
# check, found by the security checks in v0.1.1.
[stage2]
files = [
  "twinx_body.t", "twinx_body_chunked.t", "twinx_body_size_units.t", "twinx_default_root.t", "twinx_header_buffers.t",
  "twinx_location_captures.t", "twinx_return_url.t", "twinx_upstream_response.t",
  "twinx_variable_strings.t",
  "http_headers_multi.t", "http_keepalive.t", "http_listen.t", "http_location_auto.t",
  "http_max_headers.t", "http_request_port.t", "http_resolver.t",
  "http_resolver_aaaa.t", "http_resolver_cleanup.t", "http_resolver_cname.t",
  "http_resolver_ipv4.t", "http_server_name.t", "http_try_files.t", "http_uri.t",
  "http_variables.t", "ignore_invalid_headers.t", "index.t", "limit_rate.t",
  "merge_slashes.t", "not_modified.t", "post_action.t", "proxy.t", "proxy_available.t",
  "proxy_bind.t", "proxy_chunked_extra.t", "proxy_cookie.t", "proxy_cookie_flags.t",
  "proxy_duplicate_headers.t", "proxy_implicit.t", "proxy_intercept_errors.t",
  "proxy_limit_rate2.t", "proxy_max_temp_file_size.t", "proxy_method.t",
  "proxy_next_upstream.t", "proxy_next_upstream_tries.t", "proxy_noclose.t",
  "proxy_pass_request.t", "proxy_redirect.t", "proxy_request_buffering.t",
  "proxy_request_buffering_chunked.t", "proxy_set_body.t", "proxy_upstream_cookie.t",
  "proxy_variables.t", "proxy_xar.t", "range_if_range.t", "rewrite.t", "rewrite_if.t",
  "rewrite_unescape.t", "server_tokens.t", "trailers.t", "worker_channel.t",
  "worker_shutdown_timeout.t", "worker_shutdown_timeout_proxy_upgrade.t",
  "working_directory.t", "access_log.t", "gunzip.t", "gunzip_static.t", "gzip.t",
]

# Stage 3, done at v0.3.0 (2026-11-23): TLS. Files that need, besides the modules of stages 1 and 2, only
# http_ssl and the TLS features of the test client (socket_ssl*, sni, openssl
# versions, cryptx); files that also need HTTP/2, HTTP/3, stream or mail wait
# for their stages.
[stage3]
files = [
  "proxy_if.t", "proxy_request_buffering_ssl.t", "proxy_ssl.t",
  "proxy_ssl_certificate.t", "proxy_ssl_certificate_cache.t",
  "proxy_ssl_certificate_empty.t", "proxy_ssl_certificate_vars.t", "proxy_ssl_crl.t",
  "proxy_ssl_name.t", "proxy_ssl_verify.t", "proxy_ssl_verify_ip.t", "ssl.t",
  "ssl_cache.t", "ssl_cache_reload.t", "ssl_certificate_aux.t",
  "ssl_certificate_cache.t", "ssl_certificate_chain.t",
  "ssl_certificate_compression.t", "ssl_certificates.t", "ssl_client_escaped_cert.t",
  "ssl_conf_command.t", "ssl_crl.t", "ssl_curve.t", "ssl_engine_keys.t", "ssl_ktls.t",
  "ssl_ocsp.t", "ssl_password_file.t", "ssl_proxy_upgrade.t", "ssl_reject_handshake.t",
  "ssl_session_reuse.t", "ssl_session_ticket_key.t", "ssl_sigalgs.t", "ssl_sni.t",
  "ssl_sni_protocols.t", "ssl_sni_reneg.t", "ssl_sni_sessions.t", "ssl_stapling.t",
  "ssl_verify_client.t", "ssl_verify_client_trusted.t", "ssl_verify_depth.t",
]

# Stage 4, done at v0.4.0 (2026-11-24): HTTP/2. Files that need, besides the modules and test client features
# of stages 1 to 3, only http_v2; files that also need grpc, HTTP/3, caching or
# other modules wait for their stages. h2_server_tokens.t checks the name as
# server_tokens.t does, so for twinx it is renamed the same way.
[stage4]
files = [
  "h2_absolute_redirect.t", "h2_error_page.t", "h2_headers.t", "h2_host.t",
  "h2_http2.t", "h2_keepalive.t", "h2_max_headers.t", "h2_priority.t",
  "h2_proxy_max_temp_file_size.t", "h2_proxy_request_buffering.t",
  "h2_proxy_request_buffering_redirect.t", "h2_proxy_request_buffering_ssl.t",
  "h2_proxy_ssl.t", "h2_request_body.t", "h2_request_body_extra.t",
  "h2_server_tokens.t", "h2_ssl.t", "h2_ssl_variables.t", "h2_ssl_verify_client.t",
  "h2_trailers.t", "h2_variables.t", "proxy_h2.t", "proxy_h2_body_discard.t",
  "proxy_h2_early_hints.t", "proxy_h2_headers.t", "proxy_h2_method.t",
  "proxy_h2_next_upstream.t", "proxy_h2_pass_request.t",
  "proxy_h2_request_buffering.t", "proxy_h2_set_body.t", "proxy_h2_ssl.t",
  "proxy_h2_trailers.t", "worker_shutdown_timeout_h2.t",
]
