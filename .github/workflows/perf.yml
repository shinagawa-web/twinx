name: perf

# Started by hand: measures a twinx tag, a twinx pull request, or a twinx commit
# or branch against nginx (perf/run.sh, perf/lib/bench.py). It is not part of the
# judge and decides nothing.
#
# A pull request or a commit measures the scenarios named (perf/lib/scenarios.py) in one
# job; a tag, those or all of them ("all"), then a job for each group. Only a tag's
# run of all of them measures nginx, and keeps its measurements in
# perf/results/aarch64/nginx.json; the others measure twinx alone and are compared with
# those, but in the scenarios not there yet. Each job is on
# an aarch64 runner of its own: servers are only ever compared within one. The
# questions do not depend on the architecture, and aarch64 runners have given
# steadier numbers than x86_64 ones, whose CPU model changes from run to run. A pull
# request or a commit adds a build to each job.
#
# Started by hand, a tag's results of all the scenarios are committed to
# perf/results/aarch64/<tag>.json on the branch it runs on, which cannot be main (main
# takes changes only through pull requests), and, when that branch has an open pull
# request, put in one comment there that each later run replaces. A pull request's
# are put in one comment on it, replaced by each later run, and a commit's or
# branch's are only shown in the run's summary; all are kept as an artifact, and
# nothing of them is committed.
#
# A pull request that changes how the measurements are made (perf/ or these
# workflows) runs it too, on one scenario of twinx's latest release in one short
# round, and puts the results in one comment on it, replaced by each later push;
# nothing is committed. Other pull requests do not run it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: A twinx tag to measure, such as v0.1.1
        required: false
      pr:
        description: Or a twinx pull request number, to measure its head
        required: false
      ref:
        description: Or a twinx commit or branch, such as main
        required: false
      scenarios:
        description: Names of scenarios of perf/lib/scenarios.py, separated by commas, or all (a tag only, and the default for one)
        required: false

  pull_request:
    paths:
      - perf/**
      - .github/workflows/perf.yml
      - .github/workflows/perf-image.yml

permissions:
  contents: read

# A newer push to a pull request replaces the run of the one before; runs started by
# hand do not wait for each other.
concurrency:
  group: perf-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  what:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.what.outputs.tag }}
      groups: ${{ steps.what.outputs.groups }}
      only: ${{ steps.what.outputs.only }}
      names: ${{ steps.what.outputs.names }}
      all: ${{ steps.what.outputs.all }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Take one of a tag, a pull request and a ref, and the scenarios
        id: what
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PR: ${{ inputs.pr }}
          REF: ${{ inputs.ref }}
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            TAG=$(gh release view -R shinagawa-web/twinx --json tagName -q .tagName)
          fi
          version='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [ -n "$TAG" ] && [ -z "$PR$REF" ]; then [[ "$TAG" =~ $version ]] || { echo "not a version tag: $TAG"; exit 2; }
          elif [ -n "$PR" ] && [ -z "$TAG$REF" ]; then [[ "$PR" =~ ^[0-9]+$ ]] || { echo "not a pull request number: $PR"; exit 2; }
          elif [ -n "$REF" ] && [ -z "$TAG$PR" ]; then :
          else echo "give a tag, a pull request number or a ref"; exit 2; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # A change here is checked by whether one scenario measures, in minutes, not by
          # every group.
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo 'groups=["http"]' >> "$GITHUB_OUTPUT"
            echo 'only=^return, 64 connections$' >> "$GITHUB_OUTPUT"
          elif [ "$SCENARIOS" = all ] || [ -z "$SCENARIOS$PR$REF" ]; then
            [ -z "$PR$REF" ] || { echo "all is taken only with a tag; name the scenarios"; exit 2; }
            echo 'groups=["http", "config", "files", "proxy", "upstreams", "cache", "tls", "http2", "latency", "memory"]' >> "$GITHUB_OUTPUT"
            echo 'all=true' >> "$GITHUB_OUTPUT"
          elif [ -z "$SCENARIOS" ]; then
            echo "name the scenarios to measure"; exit 2
          else
            names=$(python3 - <<'EOF'
          import json, os, sys
          sys.path.insert(0, "perf/lib")
          from scenarios import SCENARIOS
          # The names have commas in them too, so the list is read as the longest names
          # it starts with, one after another, which holds while no name is two others
          # joined by a comma.
          known = {q["name"] for q in SCENARIOS}
          parts = [p.strip() for p in os.environ["SCENARIOS"].split(",") if p.strip()]
          names, unknown, i = [], [], 0
          while i < len(parts):
              j = next((j for j in range(len(parts), i, -1) if ", ".join(parts[i:j]) in known), None)
              if j is None:
                  j = next((k for k in range(i + 1, len(parts)) if any(", ".join(parts[k:m]) in known
                                                                   for m in range(k + 1, len(parts) + 1))), len(parts))
                  unknown.append(", ".join(parts[i:j]))
              else:
                  names.append(", ".join(parts[i:j]))
              i = j
          if unknown:
              sys.exit("no such scenario: " + "; ".join(unknown))
          print(json.dumps(names))
          EOF
            ) || exit 2
            echo "names=$names" >> "$GITHUB_OUTPUT"
            echo 'groups=["scenarios"]' >> "$GITHUB_OUTPUT"
          fi

  measure:
    needs: what
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.what.outputs.groups) }}
    env:
      TAG: ${{ needs.what.outputs.tag }}
      PR: ${{ inputs.pr }}
      REF: ${{ inputs.ref }}
      GROUP: ${{ matrix.group }}
      ONLY: ${{ needs.what.outputs.only }}
      NAMES: ${{ needs.what.outputs.names }}
      ALL: ${{ needs.what.outputs.all }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The registry and target/ of the last build of a pull request or a commit (perf/run.sh,
      # perf/work/build): only twinx itself is compiled. A tag's binary is fetched, not built.
      # Saved under the Cargo.lock built, and taken back from the latest of the same Rust.
      - name: Take the Rust image of the build
        id: rust
        if: env.PR != '' || env.REF != ''
        run: echo "digest=$(sed -n 's/^rust_image=rust@sha256://p' perf/run.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: build
        if: steps.rust.outputs.digest != ''
        with:
          path: perf/work/build
          key: perf-build-${{ runner.arch }}-${{ steps.rust.outputs.digest }}-
          restore-keys: perf-build-${{ runner.arch }}-${{ steps.rust.outputs.digest }}-

      - name: Measure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          what=("$TAG"); [ -z "$PR" ] || what=(--pr "$PR"); [ -z "$REF" ] || what=(--ref "$REF")
          pick=(--group "$GROUP")
          if [ -n "$NAMES" ]; then
            pick=(); while IFS= read -r n; do pick+=(--scenario "$n"); done < <(jq -r '.[]' <<<"$NAMES")
          fi
          perf/run.sh "${what[@]}" "${pick[@]}" ${ONLY:+--only "$ONLY" --quick} ${ALL:+--measure-nginx}
          mkdir -p part && cp perf/work/*/aarch64/"$GROUP".json part/

      - uses: actions/cache/save@v4
        if: >-
          steps.rust.outputs.digest != '' && hashFiles('perf/work/*/*/src-twinx-built/Cargo.lock') != '' &&
          steps.build.outputs.cache-matched-key != format('perf-build-{0}-{1}-{2}', runner.arch, steps.rust.outputs.digest, hashFiles('perf/work/*/*/src-twinx-built/Cargo.lock'))
        with:
          path: perf/work/build
          key: perf-build-${{ runner.arch }}-${{ steps.rust.outputs.digest }}-${{ hashFiles('perf/work/*/*/src-twinx-built/Cargo.lock') }}

      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.group }}
          path: part/

  merge:
    needs: [what, measure]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.what.outputs.tag }}
      PR: ${{ inputs.pr }}
      REF: ${{ inputs.ref }}
      ALL: ${{ needs.what.outputs.all }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
          merge-multiple: true

      - name: Merge and summarize
        run: |
          name=${TAG:-pr-$PR}; [ -z "$REF" ] || name=ref-${REF//\//-}
          mkdir -p merged/aarch64
          python3 perf/lib/merge.py "merged/aarch64/$name.json" parts/*.json
          [ -z "$ALL" ] || python3 perf/lib/keep.py "merged/aarch64/$name.json" merged/aarch64/nginx.json
          python3 perf/lib/compare.py "merged/aarch64/$name.json" --nginx perf/results/aarch64/nginx.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: perf
          path: merged/

  record:
    needs: [what, merge]
    if: github.event_name == 'workflow_dispatch' && inputs.tag != '' && needs.what.outputs.all == 'true'
    runs-on: ubuntu-24.04
    concurrency: perf-record
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ needs.what.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Into a directory of its own, then copied: written over the checkout's
      # files, a shorter new file keeps the end of the old one.
      - uses: actions/download-artifact@v4
        with:
          name: perf
          path: ${{ runner.temp }}/results

      - name: Commit the results
        run: |
          cp -r "$RUNNER_TEMP/results/." perf/results/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perf/results
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Record the measurements for $TAG"
          git pull --rebase -q
          git push

      - name: Comment the measurements on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: perf/lib/comment.sh "$TAG" "$BRANCH" "$RUN_URL"

  comment:
    needs: [what, merge]
    if: github.event_name == 'pull_request' || inputs.pr != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: perf
          path: perf/results

      # On a pull request that changes the measurements, its own; started by hand with
      # a pull request, the one measured.
      - name: Comment the measurements on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.what.outputs.tag }}
          PR: ${{ inputs.pr }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: perf/lib/comment.sh "${TAG:-pr-$PR}" "$BRANCH" "$RUN_URL"
