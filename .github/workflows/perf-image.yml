name: perf-image

# Builds the measuring image (perf/lib/Dockerfile) for both architectures and pushes it to
# ghcr.io/shinagawa-web/twinx/perf, tagged by perf/lib/image-tag.sh, so that the jobs of a
# run pull it instead of each building it (perf/run.sh). Runs on main for any change under
# perf/lib/, as the files the Dockerfile copies are listed only in it; a tag already pushed
# is left as it is.

on:
  push:
    branches: [main]
    paths:
      - perf/lib/**
      - .github/workflows/perf-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency: perf-image

jobs:
  push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Take the tag
        id: tag
        run: echo "image=ghcr.io/${{ github.repository }}/perf:$(perf/lib/image-tag.sh)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Look for the tag
        id: pushed
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "$IMAGE is there already"
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.pushed.outputs.yes != 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.pushed.outputs.yes != 'true'

      - uses: docker/build-push-action@v6
        if: steps.pushed.outputs.yes != 'true'
        with:
          context: perf/lib
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
