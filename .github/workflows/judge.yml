name: judge

# Every push to a claude/ branch is judged on main with the branch merged in.
# A branch that passes is merged into main; one that fails is recorded in
# status/attempts.tsv. Runs are serialized so each one judges the latest main.

on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write

concurrency:
  group: judge-main
  cancel-in-progress: false

jobs:
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BRANCH: ${{ github.ref_name }}
      TWINX_REPO: ${{ github.workspace }}
      JUDGE: ${{ runner.temp }}/harness
      # twinx is built with coverage instrumentation so the judge can see which lines
      # the cases run. Counter relocation keeps the profile current while twinx runs,
      # because the harness kills it rather than letting it exit.
      RUSTFLAGS: -C instrument-coverage -C llvm-args=-runtime-counter-relocation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Keep main's harness, so the branch is judged by main's rules
        run: cp -r harness "$JUDGE"

      - name: Merge the branch into main without committing
        id: merge
        continue-on-error: true
        run: |
          git config user.name "twinx-judge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse "origin/$BRANCH")" >> "$GITHUB_OUTPUT"
          git merge --no-ff --no-commit "origin/$BRANCH"

      - uses: Swatinem/rust-cache@v2
        if: steps.merge.outcome == 'success' && hashFiles('Cargo.toml') != ''

      - name: Install the LLVM coverage tools
        if: steps.merge.outcome == 'success' && hashFiles('Cargo.toml') != ''
        run: rustup component add llvm-tools-preview

      - name: Build
        id: build
        if: steps.merge.outcome == 'success' && hashFiles('Cargo.toml') != ''
        continue-on-error: true
        run: cargo build --release

      - name: Test
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: cargo test --release

      - name: Compare with nginx
        id: compare
        if: steps.merge.outcome == 'success'
        continue-on-error: true
        env:
          LLVM_PROFILE_FILE: ${{ runner.temp }}/profiles/twinx-%p-%c.profraw
        run: |
          mkdir -p "${{ runner.temp }}/profiles"
          python3 "$JUDGE/compare.py" --out results.json

      - name: Measure what the cases ran
        id: coverage
        if: steps.merge.outcome == 'success'
        continue-on-error: true
        run: |
          profiles="${{ runner.temp }}/profiles"
          if ls "$profiles"/*.profraw >/dev/null 2>&1 && [ -x target/release/twinx ]; then
            bin=$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin
            "$bin/llvm-profdata" merge -sparse "$profiles"/*.profraw -o "$profiles/merged.profdata"
            "$bin/llvm-cov" export target/release/twinx -instr-profile="$profiles/merged.profdata" \
              -format=lcov --ignore-filename-regex='/.cargo/registry|/rustc/' > cases.lcov
            python3 "$JUDGE/coverage.py" --base "${{ steps.merge.outputs.base }}" --lcov cases.lcov --out coverage.json
          else
            python3 "$JUDGE/coverage.py" --base "${{ steps.merge.outputs.base }}" --out coverage.json
          fi

      - name: Judge
        id: judge
        if: steps.merge.outcome == 'success' && hashFiles('results.json') != ''
        continue-on-error: true
        run: >
          python3 "$JUDGE/judge.py"
          --branch "$BRANCH"
          --base "${{ steps.merge.outputs.base }}"
          --head "${{ steps.merge.outputs.head }}"
          --build "${{ steps.build.outcome }}"
          --test "${{ steps.test.outcome }}"
          --results results.json
          --coverage coverage.json
          --verdict verdict.json

      - name: Merge into main
        if: steps.judge.outcome == 'success'
        run: |
          git add status/passing.txt
          after=$(python3 -c 'import json; print(json.load(open("verdict.json"))["cases_passing_after"])')
          git commit -q -m "Merge $BRANCH ($after cases pass)"
          git push origin HEAD:main
          git push origin --delete "$BRANCH"

      - name: Record the failed attempt
        if: steps.judge.outcome != 'success'
        run: |
          if [ -f verdict.json ]; then
            problems=$(python3 -c 'import json; print("; ".join(json.load(open("verdict.json"))["problems"]))')
          elif [ "${{ steps.merge.outcome }}" != success ]; then
            problems="the branch does not merge cleanly into main"
          else
            problems="the comparison harness did not produce results (outcome: ${{ steps.compare.outcome }})"
          fi
          git merge --abort 2>/dev/null || git reset -q --hard HEAD
          mkdir -p status
          [ -f status/attempts.tsv ] || printf 'date\tbranch\thead\tproblems\n' > status/attempts.tsv
          printf '%s\t%s\t%s\t%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$BRANCH" \
            "${{ steps.merge.outputs.head }}" "$problems" >> status/attempts.tsv
          git add status/attempts.tsv
          git commit -q -m "Record a failed attempt from $BRANCH"
          for i in 1 2 3; do git push origin HEAD:main && break; git pull -q --rebase origin main; done
          echo "::error::$problems"
          exit 1

      - name: Summary
        if: always()
        run: |
          [ -f verdict.json ] && { echo '```json'; cat verdict.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: judge-${{ github.run_id }}
          path: |
            results.json
            coverage.json
            verdict.json
          if-no-files-found: ignore
