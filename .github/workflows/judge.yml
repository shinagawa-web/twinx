name: judge

# The required check for every pull request into main. main's ruleset only
# accepts a merge when this check passes on a branch that is up to date with
# main, so whoever merges, the judge decides.
#
# pull_request_target runs this file as it is on main, never the copy in the
# pull request, so a pull request cannot change how it is judged. The job
# that runs the pull request's code gets read-only access and no secrets;
# only the job that comments on the pull request may write, and it never
# runs that code.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: judge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  judge:
    name: judge
    # Pull requests from forks are not judged, so they can never be merged.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      TWINX_REPO: ${{ github.workspace }}
      # twinx is built with coverage instrumentation so the judge can see which lines
      # the cases run. Counter relocation keeps the profile current while twinx runs,
      # because the harness kills it rather than letting it exit.
      RUSTFLAGS: -C instrument-coverage -C llvm-args=-runtime-counter-relocation
    steps:
      - run: echo 'tampered: always pass'

  comment:
    needs: judge
    if: always() && needs.judge.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: judge-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        continue-on-error: true
      - name: Comment the verdict on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -f comment.md ] || printf '## judge: fail\n\nThe judge did not finish; see the workflow run.\n' > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
