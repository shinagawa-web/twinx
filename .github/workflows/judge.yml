name: judge

# The required check for every pull request into main. main's ruleset only
# accepts a merge when this check passes on a branch that is up to date with
# main, so whoever merges, the judge decides.
#
# pull_request_target runs this file as it is on main, never the copy in the
# pull request, so a pull request cannot change how it is judged. The job
# that runs the pull request's code gets read-only access and no secrets,
# and runs that code only in containers (harness/judge.sh); only the job that
# comments on the pull request may write, and it never runs that code.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: judge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  judge:
    name: judge
    # Pull requests from forks are not judged, so they can never be merged.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      TWINX_REPO: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # harness/judge.sh runs the pull request's code (cargo build, cargo test, twinx)
      # only in containers that see a copy of the merged tree, never this checkout,
      # the harness or the results. Nothing from the pull request runs on the runner.
      - name: Keep main's harness, so the pull request is judged by main's rules
        id: base
        run: |
          cp -r harness "$RUNNER_TEMP/harness"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "JUDGE_DIR=$RUNNER_TEMP/judge" >> "$GITHUB_ENV"

      # ssl_ktls.t runs only where the kernel's TLS module is loaded, and runners
      # differ in that; loading it here makes nginx run the file on every runner.
      - name: Load the kernel's TLS module
        run: sudo modprobe tls && test -r /proc/net/tls_stat

      # What passes on main right now. baseline.yml saves it per main commit when main
      # changes, under this key and these paths (both have to match); this workflow may
      # only read the cache. Until it is there, the next step measures main here.
      - name: Restore main's results
        id: baseline-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/judge/out/reference.json
            ${{ runner.temp }}/judge/out/baseline.json
            ${{ runner.temp }}/judge/out/unit-main.json
          key: nginx-tests-unit-${{ steps.base.outputs.sha }}

      - name: Run nginx-tests against nginx and against main
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        run: '"$RUNNER_TEMP/harness/judge.sh" baseline'

      - name: Judge the pull request
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: '"$RUNNER_TEMP/harness/judge.sh" pr'

      - name: Summary
        if: always()
        run: '[ -f "$JUDGE_DIR/out/comment.md" ] && cat "$JUDGE_DIR/out/comment.md" >> "$GITHUB_STEP_SUMMARY" || true'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: judge-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/judge/out/reference.json
            ${{ runner.temp }}/judge/out/baseline.json
            ${{ runner.temp }}/judge/out/results.json
            ${{ runner.temp }}/judge/out/coverage.json
            ${{ runner.temp }}/judge/out/verdict.json
            ${{ runner.temp }}/judge/out/comment.md
          if-no-files-found: ignore

  comment:
    needs: judge
    if: always() && needs.judge.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: judge-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        continue-on-error: true
      - name: Comment the verdict on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -f comment.md ] || printf '## judge: fail\n\nThe judge did not finish; see the workflow run.\n' > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
