name: release

# For a version tag (v*): builds twinx from that tag the way the judge does, for
# x86_64 and aarch64 Linux on runners of each, runs nginx-tests against it and
# against nginx there, and publishes a GitHub release with the binaries and the
# results, and pushes the container image (packaging/docker) to ghcr.io after
# it has answered on each architecture. Run by hand with a tag to add what an
# existing release lacks. twinx's code runs only in containers; the tokens that
# publish stay on the runner, in the last jobs, which run none of twinx's code.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: an existing version tag to build and publish again
        required: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # nginx-tests run with main's harness, so a fix to the harness reaches every tag.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          persist-credentials: false

      # ssl_ktls.t runs only where the kernel's TLS module is loaded, and runners
      # differ in that; loading it here makes nginx run the file on every runner.
      - name: Load the kernel's TLS module
        run: sudo modprobe tls && test -r /proc/net/tls_stat

      - name: Build twinx in the judge's Rust image
        run: |
          image=$(python3 -c "import sys; sys.path.insert(0, 'harness'); import run_tests; print(run_tests.RUST_IMAGE)")
          tree="$RUNNER_TEMP/tree"
          mkdir -p "$tree" "$RUNNER_TEMP/cargo"
          git archive HEAD | tar -x -C "$tree"
          docker run --rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            -e HOME=/tmp -e CARGO_HOME=/cargo --tmpfs /tmp:rw,exec \
            -v "$RUNNER_TEMP/cargo:/cargo" -v "$tree:$tree" -w "$tree" "$image" cargo build --release --locked
          mkdir -p dist
          cp "$tree/target/release/twinx" "dist/twinx-$TAG-$ARCH-linux-gnu"

      - name: Run nginx-tests against nginx and against this twinx
        run: |
          export TWINX_REPO="$GITHUB_WORKSPACE"
          python3 main/harness/run_tests.py --nginx --out "dist/nginx-tests-nginx-$ARCH.json"
          python3 main/harness/run_tests.py --twinx "dist/twinx-$TAG-$ARCH-linux-gnu" \
            --reference "dist/nginx-tests-nginx-$ARCH.json" --out "dist/nginx-tests-twinx-$ARCH.json"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Write the release notes
        run: |
          python3 - <<'PY' > notes.md
          import json, os
          ok = lambda r: {n for n, s in r["tests"].items() if s == "ok"}
          print(f"twinx {os.environ['TAG']}, judged by nginx-tests (harness/nginx-tests/Dockerfile) against nginx 1.30.6 on each architecture.")
          print()
          for arch in ("x86_64", "aarch64"):
              ref = json.load(open(f"dist/nginx-tests-nginx-{arch}.json"))["files"]
              run = json.load(open(f"dist/nginx-tests-twinx-{arch}.json"))
              got, stage = run["files"], run["summary"]["stage"]
              expected = {f: ok(r) for f, r in ref.items() if ok(r)}
              passing = sorted(f for f, t in expected.items() if t <= ok(got[f]))
              subtests = sum(len(t & ok(got[f])) for f, t in expected.items())
              print(f"- {arch} Linux, stages 1 to {stage}: {len(passing)} of {len(expected)} files pass, "
                    f"{subtests} of {sum(len(t) for t in expected.values())} subtests")
          print()
          print("The binaries are built in rust:1.100-slim-bookworm (glibc 2.36). The JSON files hold every "
                "subtest's result for nginx and for each binary.")
          PY
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          (cd dist && sha256sum twinx-* nginx-tests-* > SHA256SUMS)

      - name: Publish the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "twinx $TAG" --notes-file notes.md --verify-tag
          fi

  image-check:
    needs: build
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist

      - name: Build the image for this runner and request the default page
        run: |
          docker build -f packaging/docker/Dockerfile -t twinx-image-check .
          packaging/docker/check.sh twinx-image-check

  image:
    needs: image-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # The arm64 image's RUN steps run Debian's programs under QEMU.
      - name: Set up QEMU and buildx
        run: |
          docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64
          docker buildx create --use --name twinx

      # latest moves only to the highest version tag, so publishing an older tag again leaves it.
      - name: Build and push the image for amd64 and arm64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          tags=(-t "$image:$TAG")
          newest=$(git ls-remote --tags --refs origin 'v*' | sed 's,.*refs/tags/,,' | sort -V | tail -n 1)
          if [ "$TAG" = "$newest" ]; then tags+=(-t "$image:latest"); fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 -f packaging/docker/Dockerfile "${tags[@]}" --push .
